# RelayApp media host: UDP-буферы под залпы ключевых кадров (1080p IDR ~300 КБ одним залпом).
# Стандартные 208 КБ переполняются, пока ffmpeg и vrelay делят CPU, — ядро выбрасывает
# пакеты (UdpRcvbufErrors), у зрителей рендишна фризы. Применяется к НОВЫМ сокетам.
net.core.rmem_max = 16777216
net.core.rmem_default = 8388608
net.core.wmem_max = 16777216
net.core.wmem_default = 4194304
net.core.netdev_max_backlog = 5000
