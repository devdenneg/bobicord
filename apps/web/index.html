<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Рилэй</title>
  <meta name="theme-color" content="#111312" />
  <script src="/theme-boot.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-128.png" type="image/png" sizes="128x128" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    html,body{margin:0;height:100%;background:#111312}
    :root[data-theme="light"],:root[data-theme="light"] body{background:#f3f4f1}
    /* boot = пустой экран цвета темы (без логотипа), чтобы не мелькала маленькая версия
       до маунта React — сразу за ним появляется LogoLoader того же размера */
    #boot{position:fixed;inset:0;background:#111312;z-index:9999}
    :root[data-theme="light"] #boot{background:#f3f4f1}
  </style>
</head>
<body>
  <div id="root">
    <div id="boot"></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
